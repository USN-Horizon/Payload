; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM*
build_src_filter = +<*> -<main_scanner.cpp> -<main_adapter_sim.cpp>
lib_deps =
    jgromes/RadioLib@^7.2.0
    https://github.com/PatrickBaus/Arduino-TMP1075
;test_filter = onboard/*

; Diagnostic RX scanner: SPI-polled IRQ, scans SF profile x FEM polarity.
; Upload: pio run -e scanner -t upload   (restore with -e nano_33_iot)
[env:scanner]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM*
build_src_filter = +<*> -<main.cpp> -<main_adapter_sim.cpp>
lib_deps =
    jgromes/RadioLib@^7.2.0
    https://github.com/PatrickBaus/Arduino-TMP1075

; Adapter-faithful RX for bench tests: receives like the scanner (SPI-polled
; IRQ) but forwards the fixed 128-byte buffer exactly like the real adapter
; firmware, wrapped in #PKT/#END markers + RSSI/SNR.  Receive only, PA off.
; Decode on the PC: PAYLOAD/tools/gs_capture.py  (see that file).
; Upload: pio run -e adapter_sim -t upload   (restore with -e scanner)
[env:adapter_sim]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM*
build_src_filter = +<*> -<main.cpp> -<main_scanner.cpp>
lib_deps =
    jgromes/RadioLib@^7.2.0
    https://github.com/PatrickBaus/Arduino-TMP1075


