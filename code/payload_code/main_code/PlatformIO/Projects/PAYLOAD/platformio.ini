; PlatformIO Project Configuration File  -  USN Horizon payload (ESP32-S3)
;
; Two flight firmwares + one component test per peripheral.  See README.md.
;
;   pio run -e Stack_with_LoRa    -t upload      the stack whose LoRa board has the SX1280
;   pio run -e Stack_without_LoRa -t upload      the two stacks without a radio
;   pio run -e test_<x>           -t upload      one hardware check, prints PASS/FAIL
;
; After every upload the board sits in the ROM bootloader (a USB-triggered
; reset on this main board always selects download mode): press the reset
; button, or run esptool with --after watchdog_reset (see README.md).
; The monitor keeps DTR/RTS asserted (monitor_dtr/rts = 1 below): opening the
; port with the lines dropped resets the board into the bootloader as well.

; ── Shared settings ────────────────────────────────────────────────────────────
[base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
board_upload.flash_size = 16MB
board_build.psram_type = qspi
upload_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
monitor_rts = 1
monitor_dtr = 1

; Sensor drivers used by both stacks.
[sensors]
lib_deps =
	https://github.com/tdk-invn-oss/motion.arduino.ICM45686.git#1.1.1
	adafruit/Adafruit BMP3XX Library@^2.1.6
	https://github.com/DFRobot/DFRobot_BMM350.git

; ── Flight firmware ────────────────────────────────────────────────────────────
; Three identical stacks (main + LoRa + telemetry board) share one Geiger
; (CRD) board; only one LoRa board carries an SX1280.
[env:Stack_with_LoRa]
extends = base
build_src_filter = +<Stack_with_LoRa/*>
lib_deps =
	${sensors.lib_deps}
	jgromes/RadioLib@^7.6.0

[env:Stack_without_LoRa]
extends = base
build_src_filter = +<Stack_without_LoRa/*>
lib_deps = ${sensors.lib_deps}

; ── Component tests ────────────────────────────────────────────────────────────
; One peripheral each, stand-alone, PASS/FAIL on the serial monitor.

[env:test_imu]                      ; ICM-45686 register read, gravity / rest check
extends = base
build_src_filter = -<*> +<tests/test_imu.cpp>
lib_deps = https://github.com/tdk-invn-oss/motion.arduino.ICM45686.git#1.1.1

[env:test_baro]                     ; BMP388/390 forced-mode reading
extends = base
build_src_filter = -<*> +<tests/test_baro.cpp>
lib_deps = adafruit/Adafruit BMP3XX Library@^2.1.6

[env:test_mag]                      ; BMM350 field magnitude
extends = base
build_src_filter = -<*> +<tests/test_mag.cpp>
lib_deps = https://github.com/DFRobot/DFRobot_BMM350.git

[env:test_geiger_dual]              ; both Geiger inputs, 10 s windows
extends = base
build_src_filter = -<*> +<tests/test_geiger_dual.cpp>

[env:test_sdcard]                   ; SD mount / write / read-back
extends = base
build_src_filter = -<*> +<tests/test_sdcard.cpp>

[env:test_flash]                    ; LittleFS mount / write / read-back
extends = base
build_src_filter = -<*> +<tests/test_flash.cpp>

[env:test_i2c_scan]                 ; who answers on the I2C bus
extends = base
build_src_filter = -<*> +<tests/test_i2c_scan.cpp>

[env:test_lora]                     ; SX1280 init + one TX with the flight profile
extends = base
build_src_filter = -<*> +<tests/test_lora.cpp>
lib_deps = jgromes/RadioLib@^7.6.0

[env:test_lora_temp]                ; TMP1075 on the LoRa board
extends = base
build_src_filter = -<*> +<tests/test_lora_temp.cpp>

[env:test_lora_volt]                ; DAC43401 (PA bias) register round-trips
extends = base
build_src_filter = -<*> +<tests/test_lora_volt.cpp>

[env:test_lowpower_wake]            ; launch detection on the accelerometer
extends = base
build_src_filter = -<*> +<tests/test_lowpower_wake.cpp>
lib_deps = https://github.com/tdk-invn-oss/motion.arduino.ICM45686.git#1.1.1

; Range / ground-station test transmitter: the production radio code
; (LoraTx, MavlinkFrames, Packer) sending the flight packet layout with a
; visible counter, no sensors or SD needed.
[env:test_lora_range]
extends = base
build_src_filter = -<*> +<tests/test_lora_range.cpp> +<Stack_with_LoRa/LoraTx.cpp> +<Stack_with_LoRa/MavlinkFrames.cpp>
lib_deps =
	${sensors.lib_deps}
	jgromes/RadioLib@^7.6.0

; The production sensor layer of Stack_without_LoRa (IMU FIFO at 400 Hz,
; baro continuous mode, mag data-ready): measures the real sample rates.
[env:test_sensors_fifo]
extends = base
build_src_filter = -<*> +<tests/test_sensors_fifo.cpp> +<Stack_without_LoRa/Sensors.cpp>
lib_deps = ${sensors.lib_deps}
