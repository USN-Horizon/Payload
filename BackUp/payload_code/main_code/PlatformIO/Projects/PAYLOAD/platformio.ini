; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Shared settings ────────────────────────────────────────────────────────────
[base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
board_upload.flash_size = 16MB
board_build.psram_type = qspi
upload_speed = 115200
; Stable by-id symlink for this board (tied to its USB serial), so re-enumeration
; (ttyACM0 -> ttyACM1 -> ...) no longer breaks upload/monitor. Was /dev/ttyACM0.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_B8:F8:62:4C:5C:88-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_B8:F8:62:4C:5C:88-if00
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -I mavlink/mavlink/library
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
monitor_rts = 0
monitor_dtr = 0

; ── Production build ───────────────────────────────────────────────────────────
[env:new]
extends = base
build_src_filter = +<New/*>
lib_deps =
	https://github.com/tdk-invn-oss/motion.arduino.ICM45686.git#1.1.1
	adafruit/Adafruit BMP3XX Library@^2.1.6
	jgromes/RadioLib@^7.6.0
	https://github.com/DFRobot/DFRobot_BMM350.git

[env:main]
extends = base
build_src_filter = +<*> -<tests/*>
lib_deps =
	https://github.com/tdk-invn-oss/motion.arduino.ICM45686.git#1.1.1
	adafruit/Adafruit BMP3XX Library@^2.1.6
	jgromes/RadioLib@^7.6.0
	https://github.com/DFRobot/DFRobot_BMM350.git
	https://github.com/USN-Horizon/mavlink

